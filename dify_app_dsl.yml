app:
  description: AI Customer Management Assistant with Intent Routing
  icon: 🤖
  icon_background: '#FFEAD5'
  mode: advanced-chat
  name: AI Customer Manager (Optimized)
kind: app
version: 0.1.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      image:
        enabled: true
        number_limits: 3
        transfer_methods:
        - remote_url
        - local_file
    opening_statement: "您好！我是您的智能客户管理助手。\n我可以帮您：\n1. 查询客户数据（数量、列表、详情）\n2. 回答业务政策和流程问题\n3. 进行通用对话\n\n请问有什么可以帮您？"
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        sourceType: start
        targetType: question-classifier
      id: start-classifier
      source: start
      target: classifier
    - data:
        isInIteration: false
        sourceType: question-classifier
        targetType: tool
      id: classifier-tool
      source: classifier
      sourceHandle: class_1
      target: tool_customer
    - data:
        isInIteration: false
        sourceType: question-classifier
        targetType: knowledge-retrieval
      id: classifier-knowledge
      source: classifier
      sourceHandle: class_2
      target: knowledge
    - data:
        isInIteration: false
        sourceType: question-classifier
        targetType: llm
      id: classifier-chat
      source: classifier
      sourceHandle: class_3
      target: llm_chat
    - data:
        isInIteration: false
        sourceType: tool
        targetType: llm
      id: tool-llm
      source: tool_customer
      target: llm_summary
    - data:
        isInIteration: false
        sourceType: knowledge-retrieval
        targetType: llm
      id: knowledge-llm
      source: knowledge
      target: llm_summary
    - data:
        isInIteration: false
        sourceType: llm
        targetType: end
      id: summary-end
      source: llm_summary
      target: end
    - data:
        isInIteration: false
        sourceType: llm
        targetType: end
      id: chat-end
      source: llm_chat
      target: end
    nodes:
    - data:
        desc: ''
        selected: false
        title: Start
        type: start
        variables: []
      height: 54
      id: start
      position:
        x: 80
        y: 282
      positionAbsolute:
        x: 80
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        classes:
        - id: class_1
          name: Customer Data Query
          keywords: ['count', 'how many customers', 'list customers', 'customer detail', 'who is', 'customer info']
        - id: class_2
          name: Knowledge/Policy
          keywords: ['policy', 'how to', 'process', 'rule', 'document', 'help']
        - id: class_3
          name: General Chat
          keywords: ['hi', 'hello', 'who are you', 'weather']
        desc: 'Classify user intent into Data, Knowledge, or Chat.'
        instruction: 'Classify the user query.'
        model:
          completion_params:
            temperature: 0
          mode: chat
          name: deepseek-chat
          provider: deepseek
        selected: false
        title: Intent Classifier
        type: question-classifier
      height: 200
      id: classifier
      position:
        x: 400
        y: 282
      positionAbsolute:
        x: 400
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: 'Query customer system via API.'
        model:
          mode: chat
          name: deepseek-chat
          provider: deepseek
        provider_id: app-dewbnmvus7mgx69gwb679pkt
        provider_name: CurrentApp
        provider_type: app
        selected: false
        title: Customer Tools
        tool_configurations: {}
        tool_label: Customer Query
        tool_name: customer_query
        tool_parameters:
          query: '{{#start.sys_query#}}'
        type: tool
      height: 90
      id: tool_customer
      position:
        x: 750
        y: 100
      positionAbsolute:
        x: 750
        y: 100
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        dataset_ids:
        - d82755d1-93a6-4af2-8fb1-dd481cc1132f
        desc: 'Retrieve from Knowledge Base.'
        multiple_retrieval_config:
          reranking_mode: reranking_model
          score_threshold: 0.5
          top_k: 4
        query_variable_selector:
        - start
        - sys_query
        retrieval_mode: multiple
        selected: false
        title: Knowledge Retrieval
        type: knowledge-retrieval
      height: 90
      id: knowledge
      position:
        x: 750
        y: 300
      positionAbsolute:
        x: 750
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        completion_params:
          temperature: 0.7
        context:
          enabled: true
          variable_selector:
          - knowledge
          - result
        desc: 'Summarize data or knowledge.'
        model:
          completion_params:
            temperature: 0.7
          mode: chat
          name: deepseek-chat
          provider: deepseek
        prompt_template:
        - id: 1
          role: system
          text: "You are a helpful assistant.\n\nContext from Knowledge Base:\n{{#knowledge.result#}}\n\nData from Tools:\n{{#tool_customer.text#}}\n\nPlease answer the user's question: {{#start.sys_query#}}"
        selected: false
        title: LLM Summary
        type: llm
      height: 98
      id: llm_summary
      position:
        x: 1100
        y: 200
      positionAbsolute:
        x: 1100
        y: 200
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        completion_params:
          temperature: 0.7
        context:
          enabled: false
          variable_selector: []
        desc: 'Handle general chat.'
        model:
          completion_params:
            temperature: 0.7
          mode: chat
          name: deepseek-chat
          provider: deepseek
        prompt_template:
        - id: 1
          role: system
          text: "You are a helpful assistant. Interact with the user kindly.\nUser: {{#start.sys_query#}}"
        selected: false
        title: LLM Chat
        type: llm
      height: 98
      id: llm_chat
      position:
        x: 1100
        y: 450
      positionAbsolute:
        x: 1100
        y: 450
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        outputs:
        - value_selector:
          - llm_summary
          - text
          variable: answer_1
        - value_selector:
          - llm_chat
          - text
          variable: answer_2
        selected: false
        title: End
        type: end
      height: 90
      id: end
      position:
        x: 1450
        y: 282
      positionAbsolute:
        x: 1450
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 1
