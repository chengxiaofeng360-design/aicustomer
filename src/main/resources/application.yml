# AI客户管理系统配置文件
server:
  port: 8085
  address: 0.0.0.0
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: ai-customer-management
  
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 使用远程腾讯云 CynosDB 数据库
    # url: jdbc:mysql://bj-cynosdbmysql-grp-bbi2ygoo.sql.tencentcdb.com:26713/zqgl?useUnicode=true&autoReconnect=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai
    # username: root  # 请修改为腾讯云数据库的实际用户名
    # password: 1q2w3e4R  # 请修改为腾讯云数据库的实际密码（实际值在application-secret.yml中）
    # 如果需要使用本地数据库，取消注释下面这行，注释掉上面那行
    # url: jdbc:mysql://127.0.0.1:3306/zqgl?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&autoReconnect=true
    # username: root
    # password: your_local_password
     # 生产环境数据源 (百度云)
    url: jdbc:mysql://106.12.33.232:3306/zqgl?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&autoReconnect=true
    username: root
    password: Bjzk60166200
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      auto-commit: true
      idle-timeout: 30000
      pool-name: AiCustomerHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  # 数据库初始化配置
  sql:
    init:
      mode: never  # 生产环境禁止自动执行SQL，防止数据被重置！
      # schema-locations: classpath:sql/init.sql,classpath:sql/migrations/20251228_fix_sys_user_columns.sql,classpath:sql/migrations/20260103_add_team_task_columns.sql,classpath:sql/migrations/20260105_fix_password_encryption.sql
      # data-locations: classpath:sql/data.sql
      continue-on-error: true

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      enabled: true

# 文件存储配置
file:
  upload:
    path: ./uploads/

  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  
  # HTTP编码配置
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# MyBatis配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.aicustomer.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    lazy-loading-enabled: true
    multiple-result-sets-enabled: true
    use-column-label: true
    use-generated-keys: true
    auto-mapping-behavior: partial
    default-executor-type: simple
    default-statement-timeout: 25
    default-fetch-size: 100
    safe-row-bounds-enabled: false
    safe-result-handler-enabled: true
    local-cache-scope: session
    jdbc-type-for-null: other
    lazy-load-trigger-methods: equals,clone,hashCode,toString

# 日志配置
logging:
  level:
    com.aicustomer: info
    org.springframework.security: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ./logs/app/ai-customer.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 3GB

# 管理端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# 自定义配置
ai-customer:
  # 文件存储路径
  file:
    upload-path: ./uploads/
    max-size: 104857600  # 100MB

  # 安全配置
  security:
    force-password-reset: false # 是否在启动时强制重置 admin/staff 密码 (开发环境可设为 true, 生产环境必须 false)
  
  # AI服务配置
  ai:
    enabled: true
    timeout: 30000  # 30秒超时
    # DeepSeek API配置（兼容OpenAI API）
    deepseek:
      api-key: sk-4fae8c82d7fb485aa69e7c9e7e4b4cbc  # 请在此处填写您的DeepSeek API Key
      base-url: https://api.deepseek.com/v1  # DeepSeek API端点
      model: deepseek-chat  # 使用的模型：deepseek-chat（对话模型）
      timeout: 30000  # API请求超时时间（毫秒）
      max-tokens: 2000  # 最大生成token数
      temperature: 0.7  # 温度参数，控制随机性（0-2）
      # OCR配置 (使用OCR.space免费API)
      ocr:
        enabled: true
        api-key: helloworld  # OCR.space免费API Key (可选，不填也能用)
        base-url: https://api.ocr.space/parse/image  # OCR.space端点
        language: chs  # 中文简体，支持：eng, chs, cht等
    # 火山方舟 Ark 配置
    ark:
      api-key: 0edd85dd-aa89-4f71-817b-803b10e19e6f
      base-url: https://ark.cn-beijing.volces.com/api/v3
      model: doubao-1-5-pro-32k-250115
      timeout: 30000
    # 智谱AI GLM配置（图文识别）
    zhipu:
      api-key: 975fc88a9db242f9b9044067488f2f98.fdlDhCDHP4MUGIhV
      base-url: https://open.bigmodel.cn/api/paas/v4
      model: glm-4-flash  # Flash版本 - 用于图文识别
      timeout: 30000
      max-tokens: 2000
    # 智谱AI聊天版本配置（纯文本聊天）
    zhipu-chat:
      api-key: 975fc88a9db242f9b9044067488f2f98.fdlDhCDHP4MUGIhV
      base-url: https://open.bigmodel.cn/api/paas/v4
      model: glm-3-turbo  # Turbo版本 - 免费纯文本聊天
      timeout: 30000
      max-tokens: 4000
  
  # 系统配置
  system:
    name: AI客户管理系统
    version: 1.0.0
    author: AI Customer Management Team

# 【新增】AI引擎选择配置
ai:
  engine: dify  # 已设置为Dify引擎

# 【新增】Dify平台配置
dify:
  enabled: true  # 已启用Dify引擎
  api-url: http://localhost/v1  # Dify API地址
  api-key: app-dEwBNmvUS7MGx69GWB679PkT  # Dify Agent App Key 
  dataset-id: "d82755d1-93a6-4af2-8fb1-dd481cc1132f" # Dify Knowledge Base ID
  dataset-api-key: "dataset-eZddbJm7OgvdWIqstA3Xq8FE" # 用户确认此Key包含知识库权限
  timeout: 120000  # 超时时间（毫秒）
  max-retries: 2  # 最大重试次数
  health-check-interval: 60000  # 健康检查间隔（毫秒）
  traffic-percentage: 100  # 100%流量使用Dify

# 【新增】Resilience4j Circuit Breaker配置
resilience4j:
  circuitbreaker:
    instances:
      dify:
        failure-rate-threshold: 50  # 失败率超过50%触发熔断
        slow-call-rate-threshold: 80  # 慢调用率超过80%触发
        slow-call-duration-threshold: 5s  # 超过5秒算慢调用
        wait-duration-in-open-state: 60s  # 熔断后等待1分钟
        permitted-number-of-calls-in-half-open-state: 3  # 半开状态允许3次尝试
        sliding-window-size: 10  # 滑动窗口大小（最近10次）
        sliding-window-type: COUNT_BASED  # 基于次数的窗口
        minimum-number-of-calls: 5  # 至少5次调用后才统计
        automatic-transition-from-open-to-half-open-enabled: true  # 自动恢复


