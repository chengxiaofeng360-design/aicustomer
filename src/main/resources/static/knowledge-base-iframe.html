<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>知识库管理</title>
    <link href="/lib/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="/lib/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/common.css" rel="stylesheet">
    <style>
        body {
            background: transparent;
            /* Allows common.css background to show if set on iframe, but here common.css sets linear gradient on body */
            /* However, typically iframes have their own body. Let's use the common.css class directly or set it to match */
            /* If we want it to look integrated, we might want a transparent background if it's an overlay, or the same gradient */
            /* But common.css body has: background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); */
            /* Let's remove the override that sets it to #f8f9fa */
        }

        .knowledge-container {
            padding: 1.5rem;
        }

        .header-section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        .category-tree {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            height: calc(100vh - 200px);
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .document-list {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            height: calc(100vh - 200px);
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Custom Scrollbar for modern look */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.02);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.15);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.25);
        }

        .category-item {
            padding: 0.75rem 1rem;
            margin-bottom: 0.5rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #4a5568;
        }

        .category-item:hover {
            background: #f7fafc;
            color: var(--primary-color);
        }

        .category-item.active {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            box-shadow: 0 4px 6px rgba(59, 130, 246, 0.3);
        }

        .document-item {
            padding: 1rem;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background-color 0.2s;
            border-radius: 8px;
        }

        .document-item:hover {
            background-color: #f8fafc;
        }

        .document-item:last-child {
            border-bottom: none;
        }

        .document-info {
            flex: 1;
        }

        .document-title {
            font-weight: 600;
            margin-bottom: 0.25rem;
            color: #2d3748;
        }

        .document-meta {
            font-size: 0.875rem;
            color: #718096;
        }

        .document-actions {
            display: flex;
            gap: 0.5rem;
        }

        /* 上传模态框样式 */
        .upload-area {
            border: 2px dashed var(--primary-light);
            border-radius: 12px;
            padding: 3rem;
            text-align: center;
            background: #f8faff;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-area:hover {
            background: #ebf8ff;
            border-color: var(--primary-color);
        }

        .upload-area.dragover {
            background: #ebf8ff;
            border-color: var(--primary-color);
            transform: scale(1.02);
        }

        .type-level {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            padding: 0.5rem;
            border: 1px solid #e2e8f0;
            border-radius: 0.375rem;
            background: #fff;
        }

        .type-item {
            padding: 0.5rem 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 0.25rem;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #f7fafc;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: #4a5568;
        }

        .type-item:hover {
            background: #edf2f7;
            border-color: #cbd5e0;
            color: var(--primary-color);
        }

        .type-item.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .level-2 {
            border-top: 1px solid #e2e8f0;
            margin-top: 0.5rem;
            padding-top: 0.5rem;
        }

        .selected-type-display {
            margin-top: 0.5rem;
            padding: 0.5rem 1rem;
            background: #ebf8ff;
            border: 1px solid #bee3f8;
            border-radius: 0.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #2c5282;
        }
    </style>

</head>

<body>
    <div class="knowledge-container">
        <!-- 头部操作栏 -->
        <div class="header-section">
            <h5 class="mb-0">
                <i class="bi bi-book"></i> 知识库管理
            </h5>
            <button class="btn btn-primary" onclick="showUploadModal()">
                <i class="bi bi-cloud-upload"></i> 上传文档
            </button>
        </div>

        <div class="row">
            <!-- 文档分类 -->
            <div class="col-md-3">
                <div class="category-tree">
                    <h6 class="mb-3">
                        <i class="bi bi-folder"></i> 文档分类
                    </h6>
                    <div class="category-item active" data-category="all" onclick="filterByCategory('all', this)">
                        <span><i class="bi bi-grid"></i> 全部文档</span>
                        <span class="badge bg-primary" id="totalCount">0</span>
                    </div>
                    <div id="categoryList">
                        <!-- 动态加载分类 -->
                    </div>
                </div>
            </div>

            <!-- 文档列表 -->
            <div class="col-md-9">
                <div class="document-list">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h6 class="mb-0">
                            <i class="bi bi-file-text"></i> 文档列表
                        </h6>
                        <div class="d-flex gap-2">
                            <input type="text" id="searchInput" class="form-control form-control-sm"
                                placeholder="搜索文档..." style="width: 200px;"
                                onkeyup="if(event.keyCode==13) loadDocumentList(1)">
                            <button class="btn btn-outline-primary btn-sm" onclick="loadDocumentList(1)">
                                <i class="bi bi-search"></i>
                            </button>
                        </div>
                    </div>

                    <!-- 文档项目 -->
                    <div class="document-item">
                        <div class="document-info">
                            <div class="document-title">AI客户管理系统产品手册</div>
                            <div class="document-meta">
                                <i class="bi bi-file-earmark-pdf"></i> PDF · 2.5MB · 2024-01-15
                            </div>
                        </div>
                        <div class="document-actions">
                            <button class="btn btn-outline-primary btn-sm">
                                <i class="bi bi-eye"></i>
                            </button>
                            <button class="btn btn-outline-secondary btn-sm">
                                <i class="bi bi-download"></i>
                            </button>
                            <button class="btn btn-outline-danger btn-sm">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>

                    <div class="document-item">
                        <div class="document-info">
                            <div class="document-title">客户关系管理最佳实践</div>
                            <div class="document-meta">
                                <i class="bi bi-file-earmark-word"></i> Word · 1.2MB · 2024-01-12
                            </div>
                        </div>
                        <div class="document-actions">
                            <button class="btn btn-outline-primary btn-sm">
                                <i class="bi bi-eye"></i>
                            </button>
                            <button class="btn btn-outline-secondary btn-sm">
                                <i class="bi bi-download"></i>
                            </button>
                            <button class="btn btn-outline-danger btn-sm">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>

                    <div class="document-item">
                        <div class="document-info">
                            <div class="document-title">销售数据分析报告模板</div>
                            <div class="document-meta">
                                <i class="bi bi-file-earmark-excel"></i> Excel · 856KB · 2024-01-10
                            </div>
                        </div>
                        <div class="document-actions">
                            <button class="btn btn-outline-primary btn-sm">
                                <i class="bi bi-eye"></i>
                            </button>
                            <button class="btn btn-outline-secondary btn-sm">
                                <i class="bi bi-download"></i>
                            </button>
                            <button class="btn btn-outline-danger btn-sm">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 上传模态框 -->
    <div class="modal fade" id="uploadModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="bi bi-cloud-upload"></i> 文档上传
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <!-- 文件类型选择 -->
                    <div class="mb-3">
                        <label class="form-label">文档分类 <span class="text-danger">*</span></label>
                        <small class="text-muted d-block mb-2">可选择多个分类标签，分类可在"系统配置管理 → 知识库标签"中维护</small>

                        <!-- 动态加载的标签选择区域 -->
                        <div class="type-level" id="categoryTagsContainer">
                            <!-- 动态加载分类标签 -->
                        </div>

                        <!-- 选中的标签显示 -->
                        <div class="selected-type-display" id="selectedTypeDisplay" style="display: none;">
                            <span id="selectedTypeText"></span>
                            <button type="button" class="btn btn-sm btn-outline-secondary"
                                onclick="clearTypeSelection()">
                                <i class="bi bi-x"></i> 清除
                            </button>
                        </div>

                        <input type="hidden" id="documentType" required>
                    </div>

                    <!-- 文档标签 -->
                    <div class="mb-3">
                        <label class="form-label">文档标签</label>
                        <input type="text" class="form-control" id="documentTags" placeholder="多个标签用逗号分隔">
                        <small class="text-muted">添加标签有助于更好地搜索和分类</small>
                    </div>

                    <!-- 上传区域 -->
                    <div class="upload-area" id="uploadArea">
                        <i class="bi bi-file-earmark-arrow-up display-4 text-primary mb-3"></i>
                        <h6>拖拽文件到此处或点击上传</h6>
                        <p class="text-muted mb-0">支持 PDF、Word、Excel、TXT 等格式</p>
                        <input type="file" id="fileInput" multiple style="display: none;">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/lib/bootstrap/bootstrap.bundle.min.js"></script>
    <script>
        let selectedType = '';
        let selectedTypeText = '';
        let uploadModalInstance = null;
        let currentPage = 1;
        let currentCategory = 'all';

        document.addEventListener('DOMContentLoaded', function () {
            loadCategories();
            loadDocumentList();
            loadCategoryCounts();
        });

        // 加载分类列表（从系统配置获取）
        function loadCategories() {
            fetch('/api/system-config/knowledge-categories')
                .then(response => response.json())
                .then(res => {
                    if (res.code === 200 && res.data && res.data.length > 0) {
                        renderCategories(res.data);
                    } else {
                        // 使用默认分类
                        renderCategories(['专业术语', '法律法规', '技术规范', '操作指南', '案例分析', '其他']);
                    }
                })
                .catch(err => {
                    console.error('加载分类失败:', err);
                    renderCategories(['专业术语', '法律法规', '技术规范', '操作指南', '案例分析', '其他']);
                })
                .finally(() => {
                    loadCategoryCounts();
                });
        }

        // 加载分类统计数量
        function loadCategoryCounts() {
            fetch('/api/knowledge-doc/statistics/category-counts')
                .then(response => response.json())
                .then(res => {
                    if (res.code === 200) {
                        const counts = res.data;
                        // 更新总数
                        const totalCount = document.getElementById('totalCount');
                        if (totalCount) {
                            totalCount.textContent = counts.all || 0;
                        }

                        // 更新各分类数量
                        document.querySelectorAll('.category-item[data-category]').forEach(item => {
                            const category = item.dataset.category;
                            if (category !== 'all') {
                                const badge = item.querySelector('.badge');
                                if (badge) {
                                    badge.textContent = counts[category] || 0;
                                    // 根据是否有内容切换颜色
                                    if ((counts[category] || 0) > 0) {
                                        badge.classList.remove('bg-secondary');
                                        badge.classList.add('bg-primary');
                                    } else {
                                        badge.classList.add('bg-secondary');
                                        badge.classList.remove('bg-primary');
                                    }
                                }
                            }
                        });
                    }
                })
                .catch(err => console.error('加载分类统计失败:', err));
        }

        // 渲染分类列表
        function renderCategories(categories) {
            const categoryList = document.getElementById('categoryList');
            const categoryTagsContainer = document.getElementById('categoryTagsContainer');
            const iconMap = {
                '专业术语': 'bi-book',
                '法律法规': 'bi-file-earmark-text',
                '技术规范': 'bi-gear',
                '操作指南': 'bi-list-check',
                '案例分析': 'bi-lightbulb',
                '其他': 'bi-three-dots'
            };

            let sidebarHtml = '';
            let tagsHtml = '';

            categories.forEach(category => {
                const icon = iconMap[category] || 'bi-tag';
                sidebarHtml += `
                    <div class="category-item" data-category="${category}" onclick="filterByCategory('${category}', this)">
                        <span><i class="bi ${icon}"></i> ${category}</span>
                        <span class="badge bg-secondary">0</span>
                    </div>
                `;
                // 上传模态框中的多标签选择器
                tagsHtml += `
                    <div class="type-item" data-type="${category}" onclick="toggleCategoryTag('${category}', this)">
                        <i class="bi ${icon}"></i> ${category}
                    </div>
                `;
            });

            categoryList.innerHTML = sidebarHtml;
            if (categoryTagsContainer) {
                categoryTagsContainer.innerHTML = tagsHtml;
            }
        }

        // 选中的分类标签列表
        let selectedCategories = [];

        // 切换分类标签选中状态
        function toggleCategoryTag(category, element) {
            const index = selectedCategories.indexOf(category);
            if (index > -1) {
                // 取消选中
                selectedCategories.splice(index, 1);
                element.classList.remove('active');
            } else {
                // 选中
                selectedCategories.push(category);
                element.classList.add('active');
            }
            updateSelectedDisplay();
        }

        // 更新选中显示
        function updateSelectedDisplay() {
            const displayDiv = document.getElementById('selectedTypeDisplay');
            const textSpan = document.getElementById('selectedTypeText');
            const hiddenInput = document.getElementById('documentType');

            if (selectedCategories.length > 0) {
                const badges = selectedCategories.map(c => `<span class="badge bg-primary me-1">${c}</span>`).join('');
                textSpan.innerHTML = `<i class="bi bi-check-circle"></i> 已选择：${badges}`;
                displayDiv.style.display = 'flex';
                hiddenInput.value = selectedCategories.join(',');
            } else {
                displayDiv.style.display = 'none';
                hiddenInput.value = '';
            }
        }

        // 清除分类选择
        function clearTypeSelection() {
            selectedCategories = [];
            document.querySelectorAll('#categoryTagsContainer .type-item').forEach(item => {
                item.classList.remove('active');
            });
            updateSelectedDisplay();
        }

        // 按分类筛选
        function filterByCategory(category, element) {
            currentCategory = category;
            document.querySelectorAll('.category-item').forEach(item => {
                item.classList.remove('active');
            });
            if (element) {
                element.classList.add('active');
            } else {
                document.querySelector(`[data-category="${category}"]`).classList.add('active');
            }
            loadDocumentList(1);
        }

        // 加载文档列表
        function loadDocumentList(page = 1) {
            currentPage = page;
            const container = document.querySelector('.document-list');
            const listContainer = container.querySelector('.document-items-container') || createListContainer(container);

            // 获取当前选中的分类
            const activeCategory = document.querySelector('.category-item.active');
            const category = activeCategory ? activeCategory.dataset.category : 'all';

            let url = `/api/knowledge-doc/list?pageNum=${page}&pageSize=10`;
            if (category && category !== 'all') {
                url += `&category=${category}`;
            }

            // 搜索关键词
            const searchInput = document.getElementById('searchInput');
            if (searchInput && searchInput.value) {
                url += `&keyword=${encodeURIComponent(searchInput.value)}`;
            }

            listContainer.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary" role="status"></div><div class="mt-2">正在加载...</div></div>';

            fetch(url)
                .then(response => response.json())
                .then(res => {
                    if (res.code === 200) {
                        renderDocumentList(res.data.list, listContainer);
                        // 数据量变动时刷新分类统计
                        loadCategoryCounts();
                        // 这里可以添加分页渲染逻辑
                    } else {
                        listContainer.innerHTML = `<div class="text-center text-danger py-5">加载失败: ${res.message}</div>`;
                    }
                })
                .catch(err => {
                    console.error(err);
                    listContainer.innerHTML = `<div class="text-center text-danger py-5">网络错误</div>`;
                });
        }

        function createListContainer(container) {
            const div = document.createElement('div');
            div.className = 'document-items-container';
            // 插入到搜索栏之后
            const searchBar = container.querySelector('.d-flex.justify-content-between');
            if (searchBar && searchBar.nextSibling) {
                container.insertBefore(div, searchBar.nextSibling);
            } else {
                container.appendChild(div);
            }
            // 移除旧的静态项目
            const oldItems = container.querySelectorAll('.document-item');
            oldItems.forEach(item => item.remove());
            return div;
        }

        function renderDocumentList(list, container) {
            if (!list || list.length === 0) {
                container.innerHTML = `<div class="text-center text-muted py-5">暂无文档</div>`;
                return;
            }

            let html = '';
            list.forEach(doc => {
                html += `
                    <div class="document-item">
                        <div class="document-info">
                            <div class="document-title">${doc.title || doc.fileName}</div>
                            <div class="document-meta">
                                <i class="bi ${getFileIcon(doc.fileType)}"></i> 
                                ${doc.fileType.toUpperCase()} · ${formatFileSize(doc.fileSize)} · ${formatDate(doc.createTime)}
                                <span class="ms-2 badge bg-light text-dark border">${getCategoryName(doc.category)}</span>
                            </div>
                        </div>
                        <div class="document-actions">
                            <button class="btn btn-outline-primary btn-sm" onclick="viewDocument(${doc.id})" title="查看详情">
                                <i class="bi bi-eye"></i>
                            </button>
                            <button class="btn btn-outline-secondary btn-sm" onclick="downloadDocument(${doc.id}, '${doc.fileName}')" title="下载">
                                <i class="bi bi-download"></i>
                            </button>
                            <button class="btn btn-outline-danger btn-sm" onclick="deleteDocument(${doc.id})" title="删除">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // 显示上传模态框
        function showUploadModal() {
            const modal = document.getElementById('uploadModal');
            uploadModalInstance = new bootstrap.Modal(modal);
            uploadModalInstance.show();
        }

        // 显示二级菜单
        function showLevel2(groupName) {
            document.querySelectorAll('.level2-group').forEach(group => {
                group.style.display = 'none';
            });

            document.querySelectorAll('[data-level1]').forEach(item => {
                item.classList.remove('active');
            });

            const selectedGroup = document.querySelector(`.level2-group[data-group="${groupName}"]`);
            if (selectedGroup) {
                selectedGroup.style.display = 'flex';
            }

            const selectedItem = document.querySelector(`[data-level1="${groupName}"]`);
            if (selectedItem) {
                selectedItem.classList.add('active');
            }

            document.getElementById('level2Menu').style.display = 'flex';
        }

        // 选择类型
        function selectType(typeValue, typeText) {
            selectedType = typeValue;
            selectedTypeText = typeText;

            document.getElementById('documentType').value = typeValue;

            document.querySelectorAll('[data-type]').forEach(item => {
                item.classList.remove('active');
            });

            document.querySelector(`[data-type="${typeValue}"]`).classList.add('active');

            const displayDiv = document.getElementById('selectedTypeDisplay');
            const textSpan = document.getElementById('selectedTypeText');
            textSpan.innerHTML = `<i class="bi bi-check-circle"></i> 已选择：<span class="badge bg-primary">${typeText}</span>`;
            displayDiv.style.display = 'flex';
        }

        // 清除类型选择
        function clearTypeSelection() {
            selectedType = '';
            selectedTypeText = '';
            selectedCategories = [];

            const documentType = document.getElementById('documentType');
            if (documentType) documentType.value = '';

            const displayDiv = document.getElementById('selectedTypeDisplay');
            if (displayDiv) displayDiv.style.display = 'none';

            const level2Menu = document.getElementById('level2Menu');
            if (level2Menu) level2Menu.style.display = 'none';

            document.querySelectorAll('.type-item').forEach(item => {
                item.classList.remove('active');
            });
            document.querySelectorAll('#categoryTagsContainer .type-item').forEach(item => {
                item.classList.remove('active');
            });
        }

        // 上传功能
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');

        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        function handleFiles(files) {
            const documentType = document.getElementById('documentType').value;
            if (!documentType || selectedCategories.length === 0) {
                alert('请先选择至少一个文档分类标签！');
                fileInput.value = '';
                return;
            }

            if (files.length === 0) {
                return;
            }

            // 上传逻辑
            const formData = new FormData();
            for (let i = 0; i < files.length; i++) {
                formData.append('file', files[i]);
            }
            formData.append('category', documentType);
            formData.append('documentType', documentType);
            formData.append('tags', document.getElementById('documentTags').value);

            // 显示上传中
            const originalText = uploadArea.innerHTML;
            uploadArea.innerHTML = '<div class="spinner-border text-primary"></div><div class="mt-2">正在上传...</div>';

            fetch('/api/knowledge-doc/upload', {
                method: 'POST',
                body: formData
            })
                .then(response => response.json())
                .then(res => {
                    if (res.code === 200) {
                        alert('上传成功');
                        uploadModalInstance.hide();
                        loadDocumentList(1);
                        // 重置表单
                        fileInput.value = '';
                        clearTypeSelection();
                        document.getElementById('documentTags').value = '';
                    } else {
                        alert('上传失败: ' + res.message);
                    }
                })
                .catch(err => {
                    console.error(err);
                    alert('上传出错');
                })
                .finally(() => {
                    uploadArea.innerHTML = originalText;
                });
        }

        // 删除文档
        function deleteDocument(id) {
            if (confirm('确定要删除这个文档吗？')) {
                fetch(`/api/knowledge-doc/${id}`, {
                    method: 'DELETE'
                })
                    .then(response => response.json())
                    .then(res => {
                        if (res.code === 200) {
                            alert('删除成功');
                            loadDocumentList(currentPage);
                        } else {
                            alert('删除失败: ' + res.message);
                        }
                    });
            }
        }

        // 下载文档
        function downloadDocument(id, fileName) {
            // 增加下载次数
            fetch(`/api/knowledge-doc/${id}/download`, { method: 'POST' });
            // 实际下载逻辑需要后端提供下载接口，这里暂时模拟
            alert('开始下载: ' + fileName);
            // window.location.href = `/api/knowledge-doc/${id}/file`;
        }

        // 查看文档
        function viewDocument(id) {
            fetch(`/api/knowledge-doc/${id}`)
                .then(response => response.json())
                .then(res => {
                    if (res.code === 200) {
                        const doc = res.data;
                        alert(`文档详情:\n标题: ${doc.title}\n摘要: ${doc.summary || '无'}`);
                    }
                });
        }

        // 分类切换
        document.querySelectorAll('.category-item').forEach(item => {
            item.addEventListener('click', function () {
                document.querySelectorAll('.category-item').forEach(i => i.classList.remove('active'));
                this.classList.add('active');
                loadDocumentList(1);
            });
        });

        // 搜索功能
        document.querySelector('.btn-outline-primary').addEventListener('click', () => loadDocumentList(1));
        document.querySelector('input[placeholder="搜索文档..."]').addEventListener('keyup', (e) => {
            if (e.key === 'Enter') loadDocumentList(1);
        });

        // 辅助函数
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            return new Date(dateStr).toLocaleDateString();
        }

        function getFileIcon(fileType) {
            if (!fileType) return 'bi-file-earmark';
            if (fileType.includes('pdf')) return 'bi-file-earmark-pdf text-danger';
            if (fileType.includes('doc')) return 'bi-file-earmark-word text-primary';
            if (fileType.includes('xls')) return 'bi-file-earmark-excel text-success';
            if (fileType.includes('ppt')) return 'bi-file-earmark-ppt text-warning';
            if (fileType.includes('txt')) return 'bi-file-text text-secondary';
            return 'bi-file-earmark';
        }

        function getCategoryName(category) {
            const map = {
                'product': '产品文档',
                'technical': '技术文档',
                'sales': '销售资料',
                'training': '培训材料',
                'business': '业务相关',
                'other': '其他'
            };
            return map[category] || '其他';
        }
    </script>
</body>
