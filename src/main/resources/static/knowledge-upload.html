<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识库上传 - AI客户管理系统</title>
    <link href="/lib/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="/lib/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="/css/common.css" rel="stylesheet">
    <style>
        .upload-container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .upload-area {
            border: 3px dashed #007bff;
            border-radius: 10px;
            padding: 60px 20px;
            text-align: center;
            background: #f8f9fa;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .upload-area:hover {
            background: #e9ecef;
            border-color: #0056b3;
        }
        
        .upload-area.dragover {
            background: #e7f3ff;
            border-color: #004085;
        }
        
        .file-list {
            margin-top: 30px;
        }
        
        .file-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            margin-bottom: 10px;
            background: white;
        }
        
        .file-icon {
            font-size: 2rem;
            margin-right: 15px;
            color: #007bff;
        }
        
        .file-info {
            flex: 1;
        }
        
        .file-name {
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .file-size {
            color: #6c757d;
            font-size: 0.9rem;
        }
        
        .file-progress {
            margin-top: 10px;
        }
        
        .category-section {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .category-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }
        
        .selected-categories {
            margin-top: 15px;
        }
        
        .selected-tag {
            display: inline-block;
            background: #007bff;
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            margin-right: 5px;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }
        
        .remove-tag {
            margin-left: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .action-buttons {
            margin-top: 30px;
            text-align: center;
        }
        
        .progress-bar-container {
            display: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- 页面头部 -->
        <div class="page-header">
            <div class="page-title">
                <i class="bi bi-cloud-upload"></i> 知识库上传
            </div>
            <a href="/system-config.html" class="back-home-btn">
                <i class="bi bi-arrow-left"></i> 返回知识库
            </a>
        </div>
        
        <div class="upload-container">
            <!-- 文件上传区域 -->
            <div class="upload-section">
                <h4 class="mb-4">上传文档</h4>
                
                <div class="upload-area" id="uploadArea">
                    <i class="bi bi-cloud-upload display-1 text-primary mb-3"></i>
                    <h4>拖拽文件到此处或点击选择</h4>
                    <p class="text-muted">支持 PDF、Word、Excel、图片等格式，最大 10MB</p>
                    <input type="file" id="fileInput" multiple accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png,.txt" style="display: none;">
                </div>
                
                <!-- 文件列表 -->
                <div class="file-list" id="fileList" style="display: none;">
                    <h5>待上传文件</h5>
                    <div id="fileItems">
                        <!-- 文件项将通过JavaScript动态添加 -->
                    </div>
                </div>
                
                <!-- 进度条 -->
                <div class="progress-bar-container" id="progressContainer">
                    <h5>上传进度</h5>
                    <div class="progress mb-3">
                        <div class="progress-bar" id="uploadProgressBar" role="progressbar" style="width: 0%"></div>
                    </div>
                    <div class="text-center">
                        <span id="uploadStatus">准备上传...</span>
                    </div>
                </div>
            </div>
            
            <!-- 分类选择 -->
            <div class="category-section">
                <h5 class="mb-3">选择分类</h5>
                
                <!-- 一级分类 -->
                <div class="mb-3">
                    <h6>一级分类</h6>
                    <div class="category-buttons" id="level1Categories">
                        <button class="btn btn-outline-primary" onclick="showLevel2Categories('technology')">
                            <i class="bi bi-cpu"></i> 技术文档
                        </button>
                        <button class="btn btn-outline-primary" onclick="showLevel2Categories('business')">
                            <i class="bi bi-briefcase"></i> 业务资料
                        </button>
                        <button class="btn btn-outline-primary" onclick="showLevel2Categories('contract')">
                            <i class="bi bi-file-text"></i> 合同文件
                        </button>
                        <button class="btn btn-outline-primary" onclick="showLevel2Categories('training')">
                            <i class="bi bi-mortarboard"></i> 培训材料
                        </button>
                    </div>
                </div>
                
                <!-- 二级分类 -->
                <div class="mb-3" id="level2CategoriesContainer" style="display: none;">
                    <h6>二级分类</h6>
                    <div class="category-buttons" id="level2Categories">
                        <!-- 动态加载二级分类按钮 -->
                    </div>
                </div>
                
                <!-- 已选择的分类 -->
                <div class="selected-categories" id="selectedCategoriesContainer" style="display: none;">
                    <h6>已选择的分类</h6>
                    <div id="selectedCategoriesDisplay">
                        <!-- 动态显示已选择的分类 -->
                    </div>
                </div>
            </div>
            
            <!-- 操作按钮 -->
            <div class="action-buttons">
                <button class="btn btn-primary btn-lg" id="uploadBtn" onclick="startUpload()" disabled>
                    <i class="bi bi-cloud-upload"></i> 开始上传
                </button>
                <button class="btn btn-outline-secondary btn-lg ms-2" onclick="resetAll()">
                    <i class="bi bi-arrow-clockwise"></i> 重置
                </button>
            </div>
        </div>
    </div>

    <script src="/lib/bootstrap/bootstrap.bundle.min.js"></script>
    <script>
        // 全局变量
        let selectedFiles = [];
        let selectedCategories = [];
        
        // 二级分类数据
        const categoryData = {
            technology: [
                { value: 'api', text: 'API文档', icon: 'bi-code' },
                { value: 'database', text: '数据库设计', icon: 'bi-database' },
                { value: 'frontend', text: '前端开发', icon: 'bi-laptop' },
                { value: 'backend', text: '后端开发', icon: 'bi-server' }
            ],
            business: [
                { value: 'requirement', text: '需求文档', icon: 'bi-clipboard-check' },
                { value: 'proposal', text: '项目提案', icon: 'bi-lightbulb' },
                { value: 'report', text: '业务报告', icon: 'bi-graph-up' },
                { value: 'analysis', text: '市场分析', icon: 'bi-search' }
            ],
            contract: [
                { value: 'sales', text: '销售合同', icon: 'bi-cash' },
                { value: 'service', text: '服务合同', icon: 'bi-gear' },
                { value: 'nda', text: '保密协议', icon: 'bi-shield-check' },
                { value: 'procurement', text: '采购合同', icon: 'bi-cart' }
            ],
            training: [
                { value: 'manual', text: '操作手册', icon: 'bi-book' },
                { value: 'tutorial', text: '教程指南', icon: 'bi-play-circle' },
                { value: 'presentation', text: '培训演示', icon: 'bi-presentation' },
                { value: 'video', text: '视频教程', icon: 'bi-camera-video' }
            ]
        };
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            initializeUpload();
        });
        
        // 初始化上传功能
        function initializeUpload() {
            const uploadArea = document.getElementById('uploadArea');
            const fileInput = document.getElementById('fileInput');
            
            // 点击上传区域
            uploadArea.addEventListener('click', () => {
                fileInput.click();
            });
            
            // 文件选择
            fileInput.addEventListener('change', (e) => {
                handleFiles(e.target.files);
            });
            
            // 拖拽功能
            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.classList.add('dragover');
            });
            
            uploadArea.addEventListener('dragleave', () => {
                uploadArea.classList.remove('dragover');
            });
            
            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
                handleFiles(e.dataTransfer.files);
            });
        }
        
        // 处理文件选择
        function handleFiles(files) {
            selectedFiles = Array.from(files);
            displayFileList();
            updateUploadButton();
        }
        
        // 显示文件列表
        function displayFileList() {
            const fileList = document.getElementById('fileList');
            const fileItems = document.getElementById('fileItems');
            
            if (selectedFiles.length === 0) {
                fileList.style.display = 'none';
                return;
            }
            
            fileList.style.display = 'block';
            fileItems.innerHTML = '';
            
            selectedFiles.forEach((file, index) => {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                
                const fileIcon = getFileIcon(file.name);
                const fileSize = formatFileSize(file.size);
                
                fileItem.innerHTML = `
                    <div class="file-icon">
                        <i class="bi ${fileIcon}"></i>
                    </div>
                    <div class="file-info">
                        <div class="file-name">${file.name}</div>
                        <div class="file-size">${fileSize}</div>
                    </div>
                    <button class="btn btn-sm btn-outline-danger" onclick="removeFile(${index})">
                        <i class="bi bi-trash"></i>
                    </button>
                `;
                
                fileItems.appendChild(fileItem);
            });
        }
        
        // 获取文件图标
        function getFileIcon(fileName) {
            const extension = fileName.split('.').pop().toLowerCase();
            const iconMap = {
                'pdf': 'bi-file-pdf',
                'doc': 'bi-file-word',
                'docx': 'bi-file-word',
                'xls': 'bi-file-excel',
                'xlsx': 'bi-file-excel',
                'jpg': 'bi-file-image',
                'jpeg': 'bi-file-image',
                'png': 'bi-file-image',
                'txt': 'bi-file-text'
            };
            return iconMap[extension] || 'bi-file';
        }
        
        // 格式化文件大小
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        // 移除文件
        function removeFile(index) {
            selectedFiles.splice(index, 1);
            displayFileList();
            updateUploadButton();
        }
        
        // 更新上传按钮状态
        function updateUploadButton() {
            const uploadBtn = document.getElementById('uploadBtn');
            uploadBtn.disabled = selectedFiles.length === 0;
        }
        
        // 显示二级分类
        function showLevel2Categories(categoryType) {
            const container = document.getElementById('level2CategoriesContainer');
            const categoriesDiv = document.getElementById('level2Categories');
            
            // 清空并填充二级分类
            categoriesDiv.innerHTML = '';
            if (categoryData[categoryType]) {
                categoryData[categoryType].forEach(item => {
                    categoriesDiv.innerHTML += `
                        <button class="btn btn-outline-info" onclick="selectCategory('${categoryType}', '${item.value}', '${item.text}')">
                            <i class="bi ${item.icon}"></i> ${item.text}
                        </button>
                    `;
                });
            }
            
            container.style.display = 'block';
        }
        
        // 选择分类
        function selectCategory(categoryType, categoryValue, categoryText) {
            // 检查是否已选择
            const exists = selectedCategories.find(item => item.value === `${categoryType}/${categoryValue}`);
            if (exists) {
                alert('该分类已经选择过了！');
                return;
            }
            
            // 添加到已选择列表
            selectedCategories.push({
                value: `${categoryType}/${categoryValue}`,
                text: categoryText,
                type: 'category'
            });
            
            // 更新显示
            updateSelectedCategoriesDisplay();
            
            // 隐藏二级分类
            document.getElementById('level2CategoriesContainer').style.display = 'none';
        }
        
        // 更新已选择分类显示
        function updateSelectedCategoriesDisplay() {
            const container = document.getElementById('selectedCategoriesContainer');
            const display = document.getElementById('selectedCategoriesDisplay');
            
            if (selectedCategories.length === 0) {
                container.style.display = 'none';
                return;
            }
            
            container.style.display = 'block';
            display.innerHTML = '';
            
            selectedCategories.forEach((item, index) => {
                display.innerHTML += `
                    <span class="selected-tag">
                        📁 ${item.text}
                        <span class="remove-tag" onclick="removeCategory(${index})">×</span>
                    </span>
                `;
            });
        }
        
        // 移除分类
        function removeCategory(index) {
            selectedCategories.splice(index, 1);
            updateSelectedCategoriesDisplay();
        }
        
        // 开始上传
        async function startUpload() {
            if (selectedFiles.length === 0) {
                alert('请先选择要上传的文件！');
                return;
            }
            
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('uploadProgressBar');
            const uploadStatus = document.getElementById('uploadStatus');
            
            progressContainer.style.display = 'block';
            progressBar.style.width = '0%';
            uploadStatus.textContent = '准备上传...';
            
            // 获取已选择的分类
            const selectedData = {
                categories: selectedCategories.map(item => item.value),
                categoryTexts: selectedCategories.map(item => item.text)
            };
            
            try {
                for (let i = 0; i < selectedFiles.length; i++) {
                    const file = selectedFiles[i];
                    
                    // 验证文件大小
                    if (file.size > 10 * 1024 * 1024) {
                        uploadStatus.textContent = `文件 ${file.name} 超过10MB限制`;
                        continue;
                    }
                    
                    // 验证文件类型
                    const allowedTypes = ['.pdf', '.doc', '.docx', '.xls', '.xlsx', '.jpg', '.jpeg', '.png', '.txt'];
                    const fileExtension = '.' + file.name.split('.').pop().toLowerCase();
                    if (!allowedTypes.includes(fileExtension)) {
                        uploadStatus.textContent = `文件 ${file.name} 格式不支持`;
                        continue;
                    }
                    
                    const formData = new FormData();
                    formData.append('file', file);
                    formData.append('categories', JSON.stringify(selectedData.categories));
                    formData.append('categoryTexts', JSON.stringify(selectedData.categoryTexts));
                    
                    uploadStatus.textContent = `正在上传 ${file.name}...`;
                    
                    // 模拟上传进度
                    const progress = ((i + 1) / selectedFiles.length) * 100;
                    progressBar.style.width = progress + '%';
                    
                    // 这里应该调用真实的上传API
                    // const response = await fetch('/api/knowledge/upload', {
                    //     method: 'POST',
                    //     body: formData
                    // });
                    
                    // 模拟延迟
                    await new Promise(resolve => setTimeout(resolve, 1000));
                }
                
                uploadStatus.textContent = '所有文件上传完成！';
                
                // 3秒后跳转回知识库管理页面
                setTimeout(() => {
                    window.location.href = '/system-config.html';
                }, 3000);
                
            } catch (error) {
                console.error('上传失败:', error);
                uploadStatus.textContent = '上传失败，请重试';
            }
        }
        
        // 重置所有
        function resetAll() {
            selectedFiles = [];
            selectedCategories = [];
            document.getElementById('fileInput').value = '';
            displayFileList();
            updateSelectedCategoriesDisplay();
            updateUploadButton();
            document.getElementById('progressContainer').style.display = 'none';
            document.getElementById('level2CategoriesContainer').style.display = 'none';
        }
    </script>
</body>
</html>
