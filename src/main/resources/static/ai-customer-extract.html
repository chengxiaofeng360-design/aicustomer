<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI智能识别与名片录入 - AI客户管理系统</title>
    <link href="/lib/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="/lib/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/common.css" rel="stylesheet">
    <style>
        .extract-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .main-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: none;
            overflow: hidden;
        }

        .nav-tabs {
            border-bottom: 2px solid #f1f3f5;
            padding: 0 20px;
            background: #f8f9fa;
        }

        .nav-link {
            border: none;
            color: #495057;
            padding: 15px 25px;
            font-weight: 500;
            position: relative;
            background: transparent !important;
        }

        .nav-link.active {
            color: #0d6efd;
            font-weight: 600;
        }

        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background: #0d6efd;
        }

        .tab-content {
            padding: 30px;
        }

        .upload-area {
            border: 2px dashed #dee2e6;
            border-radius: 12px;
            padding: 50px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #fdfdfe;
        }

        .upload-area:hover {
            border-color: #0d6efd;
            background: #f1f8ff;
        }

        .upload-icon {
            font-size: 48px;
            color: #adb5bd;
            margin-bottom: 15px;
        }

        .preview-container {
            position: relative;
            display: none;
            margin-top: 20px;
            text-align: center;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }

        .preview-image {
            max-width: 100%;
            max-height: 300px;
            display: block;
            margin: 0 auto;
        }

        .result-panel {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-top: 25px;
            display: none;
            border: 1px solid #e9ecef;
        }

        .info-group {
            display: grid;
            grid-template-columns: 80px 1fr;
            gap: 10px;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .info-label {
            color: #868e96;
            font-weight: 500;
        }

        .info-value {
            color: #212529;
            font-weight: 500;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.9);
            z-index: 100;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
        }
    </style>
</head>

<body>
    <div class="main-container extract-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="mb-0 fw-bold"><i class="bi bi-stars text-primary me-2"></i>AI 智能录入中心</h4>
            <a href="/" class="btn btn-outline-secondary btn-sm" type="button">
                <i class="bi bi-house-fill"></i> 返回首页
            </a>
        </div>

        <div class="main-card position-relative">
            <!-- Loading 遮罩 -->
            <div id="globalLoading" class="loading-overlay">
                <div class="spinner-border text-primary mb-3" role="status"></div>
                <p class="text-muted fw-bold" id="loadingText">正在智能分析中...</p>
            </div>

            <!-- 标签页导航 -->
            <ul class="nav nav-tabs" id="aiTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="text-tab" data-bs-toggle="tab" data-bs-target="#text-pane"
                        type="button" role="tab" aria-selected="true">
                        <i class="bi bi-file-text me-2"></i>文本智能解析
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="ocr-tab" data-bs-toggle="tab" data-bs-target="#ocr-pane" type="button"
                        role="tab" aria-selected="false">
                        <i class="bi bi-camera me-2"></i>名片/图片识别
                    </button>
                </li>
            </ul>

            <div class="tab-content">
                <!-- Tab 1: 文本解析 -->
                <div class="tab-pane fade show active" id="text-pane" role="tabpanel" tabindex="0">
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold">请输入或粘贴客户信息文本：</label>
                        <textarea class="form-control" id="textInput" rows="6"
                            placeholder="例如：张三 13800138000 北京科技公司产品经理，地址在朝阳区..."></textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="button" class="btn btn-primary px-4" onclick="handleExtractText(event)">
                            <i class="bi bi-magic text-white me-1"></i> 开始解析
                        </button>
                        <button type="button" class="btn btn-outline-secondary" onclick="clearText(event)">
                            清空
                        </button>
                    </div>

                    <!-- 文本结果展示 -->
                    <div id="textResult" class="result-panel">
                        <h6 class="border-bottom pb-2 mb-3 fw-bold text-dark">解析结果</h6>
                        <div id="textFields"></div> <!-- 动态填充 -->
                        <button type="button" class="btn btn-success w-100 mt-3" onclick="saveCustomer('text', event)">
                            <i class="bi bi-check-circle me-1"></i> 确认并保存客户
                        </button>
                    </div>
                    <!-- 隐藏域存数据 -->
                    <input type="hidden" id="textDataJson">
                </div>

                <!-- Tab 2: 图片识别 -->
                <div class="tab-pane fade" id="ocr-pane" role="tabpanel" tabindex="0">
                    <input type="file" id="fileInput" hidden accept="image/*" onchange="onFileSelected(event)">

                    <div class="upload-area" id="uploadBox" onclick="document.getElementById('fileInput').click()">
                        <i class="bi bi-cloud-upload upload-icon"></i>
                        <h5 class="fw-bold text-dark mb-2">点击上传名片或表格图片</h5>
                        <p class="text-muted small mb-0">支持 JPG, PNG，最大 5MB</p>
                    </div>

                    <div class="preview-container" id="previewBox">
                        <img id="imgPreview" class="preview-image">
                        <button type="button" class="btn btn-sm btn-light position-absolute top-0 end-0 m-2"
                            onclick="clearImage(event)" title="移除图片">
                            <i class="bi bi-x-lg"></i>
                        </button>
                    </div>

                    <div class="d-flex gap-2 mt-3" id="ocrActions" style="display:none !important;">
                        <button type="button" class="btn btn-warning text-white flex-grow-1"
                            onclick="handleOcrRecognize(event)">
                            <i class="bi bi-search me-1"></i> 开始智能识别
                        </button>
                    </div>

                    <!-- OCR结果展示 -->
                    <div id="ocrResult" class="result-panel">
                        <h6 class="border-bottom pb-2 mb-3 fw-bold text-dark">识别结果 <span class="badge bg-secondary ms-2"
                                style="font-size:10px" id="ocrSourceTag">OCR</span></h6>
                        <div id="ocrFields"></div> <!-- 动态填充 -->
                        <button type="button" class="btn btn-success w-100 mt-3" onclick="saveCustomer('ocr', event)">
                            <i class="bi bi-check-circle me-1"></i> 确认并保存客户
                        </button>
                    </div>
                    <!-- 隐藏域存数据 -->
                    <input type="hidden" id="ocrDataJson">
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <strong class="me-auto" id="toastTitle">提示</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toastMessage"></div>
        </div>
    </div>

    <script src="/lib/bootstrap/bootstrap.bundle.min.js"></script>
    <script>
        // === Core Logic ===

        function showLoading(show, text = "处理中...") {
            const el = document.getElementById('globalLoading');
            document.getElementById('loadingText').textContent = text;
            el.style.display = show ? 'flex' : 'none';
        }

        function showToast(msg, isError = false) {
            const el = document.getElementById('liveToast');
            document.getElementById('toastTitle').textContent = isError ? "错误" : "成功";
            const msgEl = document.getElementById('toastMessage');
            msgEl.textContent = msg;
            msgEl.className = isError ? 'toast-body text-danger fw-bold' : 'toast-body text-success fw-bold';
            new bootstrap.Toast(el).show();
        }

        // --- Text Logic ---
        function handleExtractText(e) {
            e.preventDefault(); // 防止刷新
            const text = document.getElementById('textInput').value.trim();
            if (!text) return showToast("请输入文本内容", true);

            showLoading(true, "AI 文本分析中...");
            fetch('/api/ai/customer-extract/extract', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            })
                .then(res => res.json())
                .then(res => {
                    showLoading(false);
                    if (res.code === 1) {
                        const data = res.data.parsedData || res.data;
                        renderResult('text', data);
                    } else {
                        showToast(res.msg || "解析失败", true);
                    }
                })
                .catch(err => {
                    showLoading(false);
                    showToast("网络请求失败", true);
                    console.error(err);
                });
        }

        function clearText(e) {
            if (e) e.preventDefault();
            document.getElementById('textInput').value = '';
            document.getElementById('textResult').style.display = 'none';
        }

        // --- OCR Logic ---
        let currentFile = null;

        function onFileSelected(e) {
            const file = e.target.files[0];
            if (!file) return;
            if (file.size > 5 * 1024 * 1024) return showToast("图片大小不能超过 5MB", true);

            currentFile = file;
            const reader = new FileReader();
            reader.onload = function (evt) {
                document.getElementById('imgPreview').src = evt.target.result;
                document.getElementById('uploadBox').style.display = 'none';
                document.getElementById('previewBox').style.display = 'block';
                document.getElementById('ocrActions').style.display = 'flex'; // 显示识别按钮
                document.getElementById('ocrResult').style.display = 'none'; // 隐藏旧结果
            };
            reader.readAsDataURL(file);
        }

        function clearImage(e) {
            if (e) e.preventDefault();
            currentFile = null;
            document.getElementById('fileInput').value = '';
            document.getElementById('previewBox').style.display = 'none';
            document.getElementById('uploadBox').style.display = 'block';
            document.getElementById('ocrActions').style.display = 'none';
            document.getElementById('ocrResult').style.display = 'none';
        }

        function handleOcrRecognize(e) {
            e.preventDefault(); // 关键：防止刷新！
            if (!currentFile) return showToast("请先选择图片", true);

            showLoading(true, "PaddleOCR + DeepSeek 联合识别中...");

            const reader = new FileReader();
            reader.readAsDataURL(currentFile);
            reader.onload = function (evt) {
                const base64 = evt.target.result;
                fetch('/api/ai/customer-extract/recognize-business-card', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: base64, fileName: currentFile.name })
                })
                    .then(res => res.json())
                    .then(res => {
                        showLoading(false);
                        if (res.code === 1) {
                            renderResult('ocr', res.data);
                            // 自动滚动到底部
                            document.getElementById('ocrResult').scrollIntoView({ behavior: 'smooth' });
                        } else {
                            showToast(res.msg || "识别失败", true);
                        }
                    })
                    .catch(err => {
                        showLoading(false);
                        showToast("识别请求异常", true);
                        console.error(err);
                    });
            };
        }

        // --- Common Render ---
        function renderResult(type, data) {
            const container = document.getElementById(type + 'Fields');
            const map = {
                'customerName': ['客户名称', data.customerName || data.name],
                'phone': ['联系电话', data.phone || data.mobile || data.phoneNumber],
                'company': ['所属公司', data.company || data.customerName || data.companyName],
                'position': ['职位抬头', data.position || data.title],
                'remark': ['智能备注', data.remark]
            };

            // 规范化数据用于保存
            const saveData = {
                customerName: map.customerName[1],
                contactPerson: data.contactPerson || map.customerName[1],
                phone: map.phone[1],
                position: map.position[1],
                remark: map.remark[1],
                customerType: (data.customerType === '企业' || (data.customerName && data.customerName.length > 4)) ? 1 : 2,
                region: data.region,
                address: data.address,
                email: data.email
            };

            let html = '';
            for (let key in map) {
                const label = map[key][0];
                const value = map[key][1] || '-';
                // 简单的HTML构造，避免复杂的DOM操作
                html += `<div class="info-group">
                            <span class="info-label">${label}</span>
                            <span class="info-value text-break">${value}</span>
                         </div>`;
            }

            container.innerHTML = html;
            document.getElementById(type + 'DataJson').value = JSON.stringify(saveData);
            document.getElementById(type + 'Result').style.display = 'block';
        }

        function saveCustomer(type, e) {
            if (e) e.preventDefault(); // 防止刷新

            const jsonStr = document.getElementById(type + 'DataJson').value;
            if (!jsonStr) return;
            const data = JSON.parse(jsonStr);

            showLoading(true, "正在录入系统...");
            fetch('/api/customer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
                .then(res => res.json())
                .then(res => {
                    showLoading(false);
                    if (res.code === 1) {
                        showToast("录入成功！正在跳转客户列表...", false);
                        setTimeout(() => {
                            window.location.href = 'customers.html';
                            // window.location.reload(); // 或者刷新页面重新录入
                        }, 1500);
                    } else {
                        showToast(res.msg || "保存失败", true);
                    }
                })
                .catch(err => {
                    showLoading(false);
                    showToast("保存请求失败", true);
                });
        }
    </script>
</body>

</html>
