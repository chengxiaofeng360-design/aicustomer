<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理</title>
    <link href="https://unpkg.com/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/@fortawesome/fontawesome-free@6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: #f5f7fa;
            font-family: 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif;
        }

        .main-container {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .page-header {
            background: white;
            border-radius: 12px;
            padding: 25px 30px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-title h2 {
            margin: 0;
            color: #2d3748;
            font-size: 1.75rem;
            font-weight: 600;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border: none;
        }

        .card-header {
            background: #667eea;
            color: white;
            border-radius: 12px 12px 0 0 !important;
            padding: 18px 25px;
            font-weight: 600;
            font-size: 1.1rem;
            border: none;
        }

        .table {
            margin-bottom: 0;
        }

        .table thead th {
            background: #f8f9fa;
            color: #495057;
            font-weight: 600;
            border-bottom: 2px solid #dee2e6;
            padding: 15px;
        }

        .table tbody td {
            padding: 15px;
            vertical-align: middle;
        }

        .btn-primary {
            background: #667eea;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 500;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .modal-content {
            border-radius: 12px;
            border: none;
        }

        .modal-header {
            background: #667eea;
            color: white;
            border-radius: 12px 12px 0 0;
            padding: 20px 25px;
            border: none;
        }

        .modal-title {
            font-weight: 600;
            font-size: 1.25rem;
        }

        .form-section {
            background: #f8fafe;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #edf2f7;
        }

        .form-section-title {
            color: #4a5568;
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #edf2f7;
            display: flex;
            align-items: center;
        }

        .form-section-title i {
            color: #667eea;
        }

        .permission-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 8px;
            padding: 5px 0;
            background: transparent;
        }

        .permission-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .permission-item:hover {
            background: #edf2f7;
        }

        .permission-item input[type="checkbox"] {
            margin-right: 8px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .permission-item label {
            margin: 0;
            cursor: pointer;
            font-size: 0.9rem;
            user-select: none;
            color: #4a5568;
        }

        .data-permission-box {
            background: transparent;
            padding: 5px 0;
        }

        .data-permission-item {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            border: 1px solid #e2e8f0;
            transition: all 0.2s;
        }

        .data-permission-item:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .data-permission-item input[type="checkbox"] {
            margin-right: 10px;
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .data-permission-item label {
            margin: 0;
            cursor: pointer;
            flex: 1;
        }

        .data-permission-item strong {
            display: block;
            color: #2d3748;
            margin-bottom: 4px;
        }

        .data-permission-item small {
            color: #718096;
        }

        .badge {
            padding: 5px 10px;
            border-radius: 6px;
            font-weight: 500;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            margin-right: 10px;
        }
    </style>
</head>

<body>
    <div class="main-container">
        <!-- 页面标题 -->
        <div class="page-header">
            <div class="page-title">
                <h2><i class="fas fa-users me-2"></i> 用户管理</h2>
            </div>
            <button class="btn btn-primary" onclick="showCreateModal()">
                <i class="fas fa-plus me-2"></i> 新建用户
            </button>
        </div>

        <!-- 用户列表 -->
        <div class="card">
            <div class="card-header">
                <i class="fas fa-list me-2"></i> 用户列表
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>用户</th>
                                <th>邮箱</th>
                                <th>手机</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="userTable">
                            <tr>
                                <td colspan="6" class="text-center py-4">
                                    <div class="spinner-border text-primary" role="status"></div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 新建/编辑用户模态框 -->
    <div class="modal fade" id="userModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">新建用户</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="userForm">
                        <input type="hidden" id="userId">

                        <!-- 基本信息 -->
                        <div class="form-section">
                            <div class="form-section-title">
                                <i class="fas fa-user me-2"></i> 基本信息
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">用户名 <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="username" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">密码 <span class="text-danger">*</span></label>
                                    <input type="password" class="form-control" id="password" required>
                                    <small class="text-muted">编辑时留空表示不修改</small>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">邮箱</label>
                                    <input type="email" class="form-control" id="email">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">手机</label>
                                    <input type="tel" class="form-control" id="phone">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">账号状态</label>
                                    <select class="form-select" id="status">
                                        <option value="1">正常</option>
                                        <option value="2">禁用</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- 菜单权限 -->
                        <div class="form-section">
                            <div class="form-section-title d-flex justify-content-between align-items-center">
                                <span><i class="fas fa-sitemap me-2"></i> 菜单权限</span>
                                <button type="button" class="btn btn-sm btn-link text-decoration-none"
                                    onclick="toggleAllMenus(true)">全选</button>
                            </div>
                            <div class="permission-list" id="menuList">
                                <!-- 动态加载 -->
                            </div>
                        </div>

                        <!-- 数据权限 -->
                        <div class="form-section">
                            <div class="form-section-title d-flex justify-content-between align-items-center">
                                <span><i class="fas fa-database me-2"></i> 数据权限</span>
                                <button type="button" class="btn btn-sm btn-link text-decoration-none"
                                    onclick="toggleAllData(true)">全选</button>
                            </div>
                            <div class="data-permission-box" id="dataPermissionBox">
                                <!-- 动态加载 -->
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="saveUser()">
                        <i class="fas fa-save me-2"></i> 保存
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/jquery@3.6.0/dist/jquery.min.js"></script>
    <script>
        let modal;

        let menus = [];

        $(document).ready(function () {
            modal = new bootstrap.Modal($('#userModal')[0]);
            loadUsers();
            loadMenus();
        });

        function loadMenus() {
            $.get('/api/user-permission/menus', function (res) {
                if (res.code === 200) {
                    menus = res.data;
                    renderMenuCheckboxes();
                }
            });
        }

        function renderMenuCheckboxes() {
            // 渲染菜单权限
            const menuHtml = menus.map(menu => `
                <div class="permission-item">
                    <input type="checkbox" id="menu_${menu.id}" value="${menu.id}" class="menu-checkbox">
                    <label for="menu_${menu.id}">${menu.icon} ${menu.name}</label>
                </div>
            `).join('');
            $('#menuList').html(menuHtml);

            // 渲染列表数据权限 - 简化为用户核心关注的3项
            const permissions = [
                { id: 'canViewSensitive', label: '敏感处理', desc: '允许查看和操作非普通用户(VIP/钻石)' },
                { id: 'canImport', label: '导入功能', desc: '允许批量导入客户数据' },
                { id: 'canDelete', label: '删除功能', desc: '允许删除和批量删除数据' }
            ];

            const dataHtml = permissions.map(p => `
                <div class="permission-item align-items-start mb-2">
                    <input type="checkbox" id="data_${p.id}" value="${p.id}" class="data-checkbox" style="margin-top: 5px">
                    <label for="data_${p.id}">
                        <strong style="font-size: 0.9rem">${p.label}</strong>
                        <div class="text-muted" style="font-size: 0.75rem">${p.desc}</div>
                    </label>
                </div>
            `).join('');
            $('#dataPermissionBox').html(`<div class="permission-list" style="grid-template-columns: repeat(auto-fill, minmax(200px, 1fr))">${dataHtml}</div>`);
        }

        function toggleAllMenus(checked) {
            $('.menu-checkbox').prop('checked', checked);
        }

        function toggleAllData(checked) {
            $('.data-checkbox').prop('checked', checked);
        }

        function loadUsers() {
            $.get('/api/user/list', function (res) {
                if (res.code === 200) {
                    renderUsers(res.data);
                } else {
                    $('#userTable').html(`
                        <tr><td colspan="6" class="text-center text-danger">加载失败: ${res.message}</td></tr>
                    `);
                }
            }).fail(function () {
                $('#userTable').html(`
                    <tr><td colspan="6" class="text-center text-danger">
                        加载失败 <a href="javascript:loadUsers()">重试</a>
                    </td></tr>
                `);
            });
        }

        function renderUsers(users) {
            if (!users || users.length === 0) {
                $('#userTable').html('<tr><td colspan="6" class="text-center text-muted py-4">暂无数据</td></tr>');
                return;
            }

            const html = users.map(u => `
                <tr>
                    <td>
                        <div class="d-flex align-items-center">
                            <div class="user-avatar">${(u.username || 'U').charAt(0).toUpperCase()}</div>
                            <strong>${u.username}</strong>
                        </div>
                    </td>
                    <td>${u.email || '-'}</td>
                    <td>${u.phone || '-'}</td>
                    <td>
                        ${u.status === 1 ? '<span class="badge bg-success">正常</span>' : '<span class="badge bg-danger">禁用</span>'}
                    </td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary" onclick="editUser(${u.id})">
                            <i class="fas fa-edit"></i> 编辑
                        </button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteUser(${u.id})">
                            <i class="fas fa-trash"></i> 删除
                        </button>
                    </td>
                </tr>
            `).join('');
            $('#userTable').html(html);
        }

        function showCreateModal() {
            $('#modalTitle').text('新建用户');
            $('#userForm')[0].reset();
            $('#userId').val('');
            $('#username').prop('readonly', false);
            $('#password').prop('required', true);
            $('input[type="checkbox"]').prop('checked', false);
            modal.show();
        }

        function editUser(id) {
            $.get(`/api/user-permission/${id}`, function (res) {
                if (res.code === 200) {
                    const u = res.data;
                    $('#modalTitle').text('编辑用户');
                    $('#userId').val(u.id);
                    $('#username').val(u.username).prop('readonly', true);
                    $('#password').val('').prop('required', false);
                    $('#email').val(u.email);
                    $('#phone').val(u.phone);
                    $('#status').val(u.status || 1);

                    // 设置权限
                    $('input[type="checkbox"]').prop('checked', false);
                    if (u.menuPermissions) {
                        u.menuPermissions.forEach(p => {
                            $(`#menu_${p}`).prop('checked', true);
                        });
                    }
                    if (u.dataPermission) {
                        const dp = u.dataPermission;
                        $('#data_canViewSensitive').prop('checked', dp.canViewSensitive);
                        $('#data_canImport').prop('checked', dp.canImport);
                        $('#data_canDelete').prop('checked', dp.canDelete);
                    }

                    modal.show();
                }
            });
        }

        function saveUser() {
            const id = $('#userId').val();
            const username = $('#username').val();
            const password = $('#password').val();

            if (!username) {
                alert('请填写必填项');
                return;
            }

            if (!id && !password) {
                alert('新建用户时密码不能为空');
                return;
            }

            // 收集菜单权限
            const menuPermissions = [];
            $('#menuList input:checked').each(function () {
                menuPermissions.push($(this).val());
            });

            const data = {
                id: id || null,
                username,
                password: password || null,
                email: $('#email').val(),
                phone: $('#phone').val(),
                status: parseInt($('#status').val()) || 1,
                menuPermissions,
                dataPermission: {
                    canViewSensitive: $('#data_canViewSensitive').is(':checked'),
                    canImport: $('#data_canImport').is(':checked'),
                    canDelete: $('#data_canDelete').is(':checked'),
                    // 为了兼容后端可能存在的旧字段，默认给true或保持一致
                    canAccessVip: $('#data_canViewSensitive').is(':checked'),
                    canAccessDiamond: $('#data_canViewSensitive').is(':checked'),
                    canExport: $('#data_canImport').is(':checked'), // 导出和导入通常成对
                    canViewAllData: true
                }
            };

            const url = id ? '/api/user-permission/update' : '/api/user-permission/create';
            const method = id ? 'PUT' : 'POST';

            $.ajax({
                url, method,
                contentType: 'application/json',
                data: JSON.stringify(data),
                success: function (res) {
                    if (res.code === 200) {
                        alert(id ? '更新成功' : '创建成功');
                        modal.hide();
                        loadUsers();
                    } else {
                        alert('操作失败: ' + res.message);
                    }
                },
                error: function () {
                    alert('操作失败，请稍后重试');
                }
            });
        }

        function deleteUser(id) {
            if (!confirm('确定要删除该用户吗？')) return;

            $.ajax({
                url: `/api/user/${id}`,
                method: 'DELETE',
                success: function (res) {
                    if (res.code === 200) {
                        alert('删除成功');
                        loadUsers();
                    } else {
                        alert('删除失败: ' + res.message);
                    }
                }
            });
        }
    </script>
</body>

</html>
