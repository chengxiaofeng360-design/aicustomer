<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        .container-fluid {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* 页面标题 */
        .page-header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-title {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .page-title i {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .page-title h2 {
            font-weight: 700;
            color: #2d3748;
            margin: 0;
        }

        .page-subtitle {
            color: #718096;
            font-size: 0.95rem;
            margin: 0;
        }

        /* 卡片样式 */
        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 20px 30px;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .card-body {
            padding: 30px;
        }

        /* 按钮样式 */
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        /* 表格样式 */
        .table {
            margin: 0;
        }

        .table thead th {
            background: #f7fafc;
            color: #4a5568;
            font-weight: 600;
            border: none;
            padding: 15px;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        .table tbody td {
            padding: 15px;
            vertical-align: middle;
            border-color: #e2e8f0;
        }

        .table tbody tr {
            transition: all 0.2s;
        }

        .table tbody tr:hover {
            background: #f7fafc;
            transform: scale(1.01);
        }

        /* 模态框样式 */
        .modal-content {
            border: none;
            border-radius: 20px;
            overflow: hidden;
        }

        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 25px 30px;
        }

        .modal-title {
            font-weight: 700;
            font-size: 1.3rem;
        }

        .modal-body {
            padding: 30px;
        }

        /* 权限区域 */
        .permission-section {
            background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
            border: 2px solid #e2e8f0;
        }

        .permission-section h6 {
            color: #2d3748;
            font-weight: 700;
            margin-bottom: 20px;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .permission-section h6 i {
            color: #667eea;
            font-size: 1.3rem;
        }

        /* 权限网格 */
        .permission-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }

        .permission-item {
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 15px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .permission-item:hover {
            border-color: #667eea;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }

        .permission-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .permission-item label {
            cursor: pointer;
            margin: 0;
            font-weight: 500;
            color: #4a5568;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .permission-item input[type="checkbox"]:checked+label {
            color: #667eea;
            font-weight: 600;
        }

        /* 数据权限项 */
        .data-permission-item {
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 15px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .data-permission-item:hover {
            border-color: #667eea;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.2);
        }

        .data-permission-item input[type="checkbox"] {
            width: 22px;
            height: 22px;
            cursor: pointer;
            accent-color: #667eea;
            margin-right: 12px;
        }

        .data-permission-item label {
            cursor: pointer;
            margin: 0;
            flex: 1;
        }

        .data-permission-item strong {
            color: #2d3748;
            font-size: 1.05rem;
            display: block;
            margin-bottom: 5px;
        }

        .data-permission-item small {
            color: #718096;
            font-size: 0.9rem;
        }

        /* 表单样式 */
        .form-label {
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 8px;
        }

        .form-control,
        .form-select {
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            padding: 12px 15px;
            transition: all 0.3s;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        /* 徽章样式 */
        .badge {
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 600;
        }

        /* 分隔线 */
        .section-divider {
            height: 2px;
            background: linear-gradient(90deg, transparent, #667eea, #764ba2, transparent);
            margin: 30px 0;
            border-radius: 2px;
        }

        /* 动画 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            animation: fadeIn 0.5s ease-out;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .permission-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <!-- 页面标题 -->
        <div class="page-header">
            <div class="page-title">
                <i class="fas fa-users-cog"></i>
                <div>
                    <h2>用户管理</h2>
                    <p class="page-subtitle">管理系统用户及其访问权限</p>
                </div>
            </div>
            <button class="btn btn-primary" onclick="showCreateUserModal()">
                <i class="fas fa-plus me-2"></i> 新建用户
            </button>
        </div>

        <!-- 用户列表 -->
        <div class="card">
            <div class="card-header">
                <i class="fas fa-list me-2"></i> 用户列表
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>用户名</th>
                                <th>真实姓名</th>
                                <th>邮箱</th>
                                <th>手机</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="userTableBody">
                            <tr>
                                <td colspan="6" class="text-center py-4">
                                    <div class="spinner-border text-primary" role="status">
                                        <span class="visually-hidden">加载中...</span>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 创建/编辑用户模态框 -->
    <div class="modal fade" id="userModal" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="userModalTitle">
                        <i class="fas fa-user-plus me-2"></i> 新建用户
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="userForm">
                        <input type="hidden" id="userId">

                        <!-- 基本信息 -->
                        <div class="permission-section">
                            <h6><i class="fas fa-id-card"></i> 基本信息</h6>
                            <div class="row">
                                <div class="col-md-3 mb-3">
                                    <label class="form-label">用户名 <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="username" required placeholder="请输入用户名">
                                </div>
                                <div class="col-md-3 mb-3">
                                    <label class="form-label">密码 <span class="text-danger">*</span></label>
                                    <input type="password" class="form-control" id="password" required
                                        placeholder="请输入密码">
                                    <small class="text-muted">编辑时留空表示不修改</small>
                                </div>
                                <div class="col-md-3 mb-3">
                                    <label class="form-label">真实姓名 <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="realName" required
                                        placeholder="请输入真实姓名">
                                </div>
                                <div class="col-md-3 mb-3">
                                    <label class="form-label">状态</label>
                                    <select class="form-select" id="status">
                                        <option value="1">正常</option>
                                        <option value="2">禁用</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">邮箱</label>
                                    <input type="email" class="form-control" id="email" placeholder="请输入邮箱">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">手机号</label>
                                    <input type="tel" class="form-control" id="phone" placeholder="请输入手机号">
                                </div>
                            </div>
                        </div>

                        <div class="section-divider"></div>

                        <!-- 菜单权限 -->
                        <div class="permission-section">
                            <h6><i class="fas fa-sitemap"></i> 菜单权限</h6>
                            <p class="text-muted mb-3">勾选用户可以访问的菜单功能</p>
                            <div class="permission-grid" id="menuPermissions">
                                <!-- 动态加载 -->
                            </div>
                        </div>

                        <div class="section-divider"></div>

                        <!-- 数据权限 -->
                        <div class="permission-section">
                            <h6><i class="fas fa-database"></i> 数据权限</h6>
                            <p class="text-muted mb-3">勾选用户可以访问的数据范围和操作权限</p>
                            <div id="dataPermissions">
                                <!-- 动态加载 -->
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="fas fa-times me-2"></i> 取消
                    </button>
                    <button type="button" class="btn btn-primary" onclick="saveUser()">
                        <i class="fas fa-save me-2"></i> 保存
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script>
        let userModal;

        // 所有菜单定义 - 功能菜单
        const allMenus = [
            { id: 'home', name: '首页', icon: '🏠', category: '基础' },
            { id: 'customer-list', name: '客户列表', icon: '📋', category: '客户管理' },
            { id: 'customer-add', name: '新增客户', icon: '➕', category: '客户管理' },
            { id: 'customer-import', name: '批量导入', icon: '📥', category: '客户管理' },
            { id: 'communication-list', name: '沟通记录', icon: '💬', category: '沟通管理' },
            { id: 'communication-add', name: '新增记录', icon: '✍️', category: '沟通管理' },
            { id: 'ai-chat', name: 'AI对话', icon: '🤖', category: 'AI功能' },
            { id: 'ai-analysis', name: '智能分析', icon: '📊', category: 'AI功能' },
            { id: 'team-task', name: '任务管理', icon: '✅', category: '团队协作' },
            { id: 'team-report', name: '进度汇报', icon: '📈', category: '团队协作' },
            { id: 'knowledge-doc', name: '文档管理', icon: '📚', category: '知识库' },
            { id: 'knowledge-faq', name: '常见问题', icon: '❓', category: '知识库' },
            { id: 'message', name: '消息中心', icon: '📬', category: '基础' },
            { id: 'report-customer', name: '客户统计', icon: '📊', category: '数据报表' },
            { id: 'report-business', name: '业务分析', icon: '💼', category: '数据报表' },
            { id: 'system-user', name: '用户管理', icon: '👤', category: '系统管理' },
            { id: 'system-config', name: '系统配置', icon: '⚙️', category: '系统管理' }
        ];

        // 所有数据权限定义 - 只保留两个核心设置
        const allDataPermissions = [
            { id: 'can-export', name: '允许导出数据', description: '可以导出客户、沟通记录等数据为Excel、CSV等格式', icon: '📤' },
            { id: 'can-delete', name: '允许删除数据', description: '可以删除客户、沟通记录等重要数据', icon: '🗑️' }
        ];

        $(document).ready(function () {
            userModal = new bootstrap.Modal(document.getElementById('userModal'));
            loadUsers();
            // 权限选项延迟加载，只在打开模态框时渲染
        });

        function renderMenuPermissions() {
            const container = $('#menuPermissions');
            container.empty();

            // 按分类分组
            const categories = {};
            allMenus.forEach(menu => {
                if (!categories[menu.category]) {
                    categories[menu.category] = [];
                }
                categories[menu.category].push(menu);
            });

            // 渲染每个分类
            Object.keys(categories).forEach(category => {
                container.append(`
                    <div style="grid-column: 1 / -1; margin-top: 15px; margin-bottom: 10px;">
                        <strong style="color: #667eea; font-size: 0.9rem;">
                            <i class="fas fa-folder-open me-1"></i> ${category}
                        </strong>
                    </div>
                `);

                categories[category].forEach(menu => {
                    container.append(`
                        <div class="permission-item">
                            <input class="form-check-input" type="checkbox" id="menu_${menu.id}" value="${menu.id}">
                            <label class="form-check-label" for="menu_${menu.id}">
                                <span>${menu.icon}</span>
                                <span>${menu.name}</span>
                            </label>
                        </div>
                    `);
                });
            });
        }

        function renderDataPermissions() {
            const container = $('#dataPermissions');
            container.empty();

            // 直接渲染，不需要分类
            allDataPermissions.forEach(perm => {
                container.append(`
                    <div class="data-permission-item">
                        <input class="form-check-input" type="checkbox" id="data_${perm.id}" value="${perm.id}">
                        <label class="form-check-label" for="data_${perm.id}">
                            <strong>${perm.icon} ${perm.name}</strong>
                            <small>${perm.description}</small>
                        </label>
                    </div>
                `);
            });
        }

        function loadUsers() {
            const tbody = $('#userTableBody');

            // 设置超时
            const timeout = setTimeout(function () {
                tbody.html(`
                    <tr>
                        <td colspan="6" class="text-center py-4">
                            <div class="alert alert-warning mb-0">
                                <i class="fas fa-exclamation-triangle me-2"></i>
                                加载超时，请检查网络连接或
                                <a href="javascript:loadUsers()" class="alert-link">点击重试</a>
                            </div>
                        </td>
                    </tr>
                `);
            }, 10000); // 10秒超时

            $.ajax({
                url: '/api/user/list',
                method: 'GET',
                timeout: 10000,
                success: function (response) {
                    clearTimeout(timeout);
                    if (response.code === 200) {
                        renderUserTable(response.data);
                    } else {
                        tbody.html(`
                            <tr>
                                <td colspan="6" class="text-center py-4">
                                    <div class="alert alert-danger mb-0">
                                        <i class="fas fa-times-circle me-2"></i>
                                        ${response.message || '加载失败'}
                                        <a href="javascript:loadUsers()" class="alert-link ms-2">重试</a>
                                    </div>
                                </td>
                            </tr>
                        `);
                    }
                },
                error: function (xhr, status, error) {
                    clearTimeout(timeout);
                    let errorMsg = '加载失败';
                    if (status === 'timeout') {
                        errorMsg = '请求超时，请检查网络连接';
                    } else if (xhr.status === 404) {
                        errorMsg = 'API接口不存在';
                    } else if (xhr.status === 500) {
                        errorMsg = '服务器错误';
                    }

                    tbody.html(`
                        <tr>
                            <td colspan="6" class="text-center py-4">
                                <div class="alert alert-danger mb-0">
                                    <i class="fas fa-times-circle me-2"></i>
                                    ${errorMsg}
                                    <a href="javascript:loadUsers()" class="alert-link ms-2">重试</a>
                                </div>
                            </td>
                        </tr>
                    `);
                }
            });
        }

        function renderUserTable(users) {
            const tbody = $('#userTableBody');
            tbody.empty();

            if (!users || users.length === 0) {
                tbody.html(`
                    <tr>
                        <td colspan="6" class="text-center py-5">
                            <div style="color: #a0aec0; font-size: 1.1rem;">
                                <i class="fas fa-users" style="font-size: 3rem; margin-bottom: 15px; display: block;"></i>
                                <p class="mb-2">暂无用户数据</p>
                                <small>点击上方"新建用户"按钮创建第一个用户</small>
                            </div>
                        </td>
                    </tr>
                `);
                return;
            }

            users.forEach(user => {
                // 处理状态
                const statusLabel = user.status === 1 ?
                    '<span class="badge bg-success"><i class="fas fa-check-circle me-1"></i>正常</span>' :
                    '<span class="badge bg-danger"><i class="fas fa-ban me-1"></i>禁用</span>';

                // 处理真实姓名 - 如果为空则显示用户名
                const displayName = user.realName || user.username;

                // 处理邮箱和手机 - 添加图标
                const emailDisplay = user.email ?
                    `<i class="fas fa-envelope text-muted me-1"></i>${user.email}` :
                    '<span class="text-muted">-</span>';
                const phoneDisplay = user.phone ?
                    `<i class="fas fa-phone text-muted me-1"></i>${user.phone}` :
                    '<span class="text-muted">-</span>';

                tbody.append(`
                    <tr>
                        <td>
                            <div class="d-flex align-items-center">
                                <div class="me-2" style="width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; color: white; font-weight: 600;">
                                    ${user.username.charAt(0).toUpperCase()}
                                </div>
                                <strong>${user.username}</strong>
                            </div>
                        </td>
                        <td>${displayName}</td>
                        <td><small>${emailDisplay}</small></td>
                        <td><small>${phoneDisplay}</small></td>
                        <td>${statusLabel}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary me-2" onclick="editUser(${user.id})" title="编辑用户">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteUser(${user.id})" title="删除用户">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `);
            });

            // 添加统计信息
            const activeCount = users.filter(u => u.status === 1).length;
            const inactiveCount = users.filter(u => u.status !== 1).length;

            tbody.append(`
                <tr style="background: #f7fafc; font-weight: 600;">
                    <td colspan="4">
                        <i class="fas fa-chart-bar me-2 text-primary"></i>
                        统计：共 ${users.length} 个用户
                    </td>
                    <td colspan="2">
                        <span class="badge bg-success me-2">${activeCount} 正常</span>
                        ${inactiveCount > 0 ? `<span class="badge bg-danger">${inactiveCount} 禁用</span>` : ''}
                    </td>
                </tr>
            `);
        }

        function showCreateUserModal() {
            // 延迟渲染权限选项（只在需要时渲染）
            if ($('#menuPermissions').children().length === 0) {
                renderMenuPermissions();
                renderDataPermissions();
            }

            $('#userModalTitle').html('<i class="fas fa-user-plus me-2"></i> 新建用户');
            $('#userForm')[0].reset();
            $('#userId').val('');
            $('#password').prop('required', true);
            $('#username').prop('readonly', false);
            $('input[type="checkbox"]').prop('checked', false);
            $('#menu_home').prop('checked', true);
            $('#menu_customer-list').prop('checked', true);
            $('#menu_communication-list').prop('checked', true);
            $('#menu_message').prop('checked', true);
            userModal.show();
        }

        function editUser(userId) {
            // 延迟渲染权限选项（只在需要时渲染）
            if ($('#menuPermissions').children().length === 0) {
                renderMenuPermissions();
                renderDataPermissions();
            }

            $.get(`/api/user-permission/${userId}`, function (response) {
                if (response.code === 200) {
                    const user = response.data;
                    $('#userModalTitle').html('<i class="fas fa-user-edit me-2"></i> 编辑用户');
                    $('#userId').val(user.id);
                    $('#username').val(user.username).prop('readonly', true);
                    $('#password').val('').prop('required', false);
                    $('#realName').val(user.realName);
                    $('#email').val(user.email);
                    $('#phone').val(user.phone);
                    $('#status').val(user.status);

                    $('input[type="checkbox"]').prop('checked', false);

                    if (user.menuPermissions) {
                        user.menuPermissions.forEach(menuId => {
                            $(`#menu_${menuId}`).prop('checked', true);
                        });
                    }

                    if (user.dataPermission) {
                        if (user.dataPermission.canExport) $('#data_can-export').prop('checked', true);
                        if (user.dataPermission.canDelete) $('#data_can-delete').prop('checked', true);
                    }

                    userModal.show();
                }
            });
        }

        function saveUser() {
            const userId = $('#userId').val();
            const username = $('#username').val();
            const password = $('#password').val();
            const realName = $('#realName').val();

            if (!username || !realName) {
                alert('请填写必填项');
                return;
            }

            if (!userId && !password) {
                alert('新建用户时密码不能为空');
                return;
            }

            const menuPermissions = [];
            $('#menuPermissions input[type="checkbox"]:checked').each(function () {
                menuPermissions.push($(this).val());
            });

            const dataPermission = {
                canExport: $('#data_can-export').is(':checked'),
                canDelete: $('#data_can-delete').is(':checked')
            };

            const data = {
                id: userId || null,
                username: username,
                password: password || null,
                realName: realName,
                email: $('#email').val(),
                phone: $('#phone').val(),
                status: parseInt($('#status').val()),
                menuPermissions: menuPermissions,
                dataPermission: dataPermission
            };

            const url = userId ? '/api/user-permission/update' : '/api/user-permission/create';
            const method = userId ? 'PUT' : 'POST';

            $.ajax({
                url: url,
                method: method,
                contentType: 'application/json',
                data: JSON.stringify(data),
                success: function (response) {
                    if (response.code === 200) {
                        alert(userId ? '更新成功' : '创建成功');
                        userModal.hide();
                        loadUsers();
                    } else {
                        alert('操作失败: ' + response.message);
                    }
                },
                error: function () {
                    alert('操作失败，请稍后重试');
                }
            });
        }

        function deleteUser(userId) {
            if (!confirm('确定要删除该用户吗？')) {
                return;
            }

            $.ajax({
                url: `/api/user/${userId}`,
                method: 'DELETE',
                success: function (response) {
                    if (response.code === 200) {
                        alert('删除成功');
                        loadUsers();
                    } else {
                        alert('删除失败: ' + response.message);
                    }
                }
            });
        }
    </script>
</body>

</html>
