<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识库管理 - AI客户管理系统</title>
    <link href="/lib/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="/lib/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/common.css" rel="stylesheet">
    <style>
        .knowledge-container {
            width: 100%;
            height: calc(100vh - 80px);
            padding: 0;
            margin: 0;
        }

        .iframe-container {
            width: 100%;
            height: 100%;
            border: none;
            background: rgba(255, 255, 255, 0.5);
        }

        /* Custom sidebar styles to match theme */
        .list-group-item.active {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            border-color: transparent;
            color: white !important;
            /* Ensure text is white */
        }

        .list-group-item {
            color: #4a5568;
            transition: all 0.2s;
            border-radius: 8px !important;
            margin-bottom: 4px;
        }

        .list-group-item:hover {
            background-color: #f7fafc;
            color: var(--primary-color);
        }

        /* Apply common gradient to specific elements if strictly needed, 
           but navbar usually handles it via style attribute or custom class */
        .navbar-custom {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>

<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="bi bi-book-half"></i> 知识管理系统
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/index.html">
                    <i class="bi bi-house"></i> 返回首页
                </a>
            </div>
        </div>
    </nav>

    <div class="d-flex" style="height: calc(100vh - 56px);">
        <!-- 侧边栏 -->
        <div class="bg-white border-end" style="width: 250px; flex-shrink: 0;">
            <div class="list-group list-group-flush pt-3 px-2">
                <a href="#" class="list-group-item list-group-item-action active border-0 px-4 py-3"
                    onclick="switchModule(this, '/knowledge-base-iframe.html')">
                    <i class="bi bi-book me-2"></i> 知识库管理
                </a>
                <a href="#" class="list-group-item list-group-item-action border-0 px-4 py-3"
                    onclick="switchModule(this, '/faq-management-iframe.html')">
                    <i class="bi bi-question-circle me-2"></i> FAQ问答管理
                </a>
            </div>
        </div>

        <!-- 内容区 -->
        <div class="flex-grow-1 bg-light">
            <iframe id="contentFrame" src="/knowledge-base-iframe.html" class="iframe-container"></iframe>
        </div>
    </div>

    <script src="/lib/bootstrap/bootstrap.bundle.min.js"></script>
    <script>
        function switchModule(element, url) {
            // 更新激活状态
            document.querySelectorAll('.list-group-item').forEach(item => {
                item.classList.remove('active');
            });
            element.classList.add('active');

            // 切换iframe内容
            document.getElementById('contentFrame').src = url;
        }
    </script>
</body>

</html>
